<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="100%" height="100%">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Graduate Cap on Top of C -->
  <g transform="translate(18, 5) scale(0.42)">
    <polygon points="50,15 92,36 50,55 8,36" fill="url(#foilGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M26,43 L26,58 C26,70 74,70 74,58 L74,43" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="50" cy="35" r="4" fill="url(#goldCapGrad)"/>
    <path d="M50,35 Q70,35 78,54 L82,75" fill="none" stroke="url(#goldCapGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Elegant Script "Class" Text -->
  <text x="120" y="52" text-anchor="middle" font-family="'Cinzel Decorative', 'Cinzel', serif" font-weight="700" font-size="44" fill="url(#foilGrad)" stroke="#ffffff" stroke-width="0.8" filter="url(#textShadow)" letter-spacing="4">
    CLASS
  </text>

  <!-- Number 2026 -->
  <text x="120" y="102" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="48" fill="url(#foilGrad)" stroke="#ffffff" stroke-width="1" filter="url(#textShadow)" letter-spacing="8">
    2026
  </text>
  
  <line x1="45" y1="62" x2="195" y2="62" stroke="url(#foilGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>
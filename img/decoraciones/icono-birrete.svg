<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 12 100 102" width="100%" height="100%">
  <defs>
    <!-- Gradiente Oro Real para Bordes y Corona -->
    <linearGradient id="capGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="25%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#99731d"/>
      <stop offset="100%" stop-color="#523c08"/>
    </linearGradient>

    <!-- Terciopelo Borgoña / Vino Tinto Profundo para el Sombrero -->
    <linearGradient id="capVelvetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b0d23"/>
      <stop offset="45%" stop-color="#400311"/>
      <stop offset="85%" stop-color="#240008"/>
      <stop offset="100%" stop-color="#140004"/>
    </linearGradient>

    <linearGradient id="capVelvetBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#400311"/>
      <stop offset="100%" stop-color="#1c0006"/>
    </linearGradient>

    <!-- Hilos de Seda y Borla Dorada -->
    <linearGradient id="tasselSilk" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#805b10"/>
    </linearGradient>

    <!-- Sombra 3D -->
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1a0005" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#capShadow)">
    <!-- Corona de Laureles de Honor Dorada Exterior -->
    <g fill="url(#capGold)" opacity="0.9">
      <!-- Laurel Izquierdo -->
      <path d="M 33 90 C 23 85 16 75 14 64 C 18 67 24 69 29 70 C 22 61 20 51 21 41 C 24 46 29 50 34 52 C 29 44 31 34 35 26 C 38 32 41 37 44 40"/>
      <!-- Laurel Derecho -->
      <path d="M 87 90 C 97 85 104 75 106 64 C 102 67 96 69 91 70 C 98 61 100 51 99 41 C 96 46 91 50 86 52 C 91 44 89 34 85 26 C 82 32 79 37 76 40"/>
      <!-- Cinta / Lazo Inferior de Gala -->
      <circle cx="60" cy="98" r="3.5" fill="url(#capGold)"/>
      <path d="M 57 99 Q 47 106 42 112 Q 50 108 58 102 Z" fill="url(#capGold)"/>
      <path d="M 63 99 Q 73 106 78 112 Q 70 108 62 102 Z" fill="url(#capGold)"/>
    </g>

    <!-- Base / Casquete del Birrete (Calavera) -->
    <path d="M 36 50 L 36 67 C 36 80 84 80 84 67 L 84 50 C 76 56 68 59 60 59 C 52 59 44 56 36 50 Z" 
          fill="url(#capVelvetBase)" stroke="url(#capGold)" stroke-width="1.2"/>
    <path d="M 40 68 C 46 75 74 75 80 68" fill="none" stroke="url(#capGold)" stroke-width="0.8" opacity="0.6"/>

    <!-- Tapa Romboidal Superior (Mortarboard) en Terciopelo y Oro -->
    <!-- Borde de Oro Base con Relieve -->
    <polygon points="60,18 106,39 60,60 14,39" fill="url(#capGold)" stroke="#3a2503" stroke-width="0.6"/>
    <!-- Superficie Interior de Terciopelo Vino Tinto -->
    <polygon points="60,20.5 102,39 60,57.5 18,39" fill="url(#capVelvetTop)"/>
    
    <!-- Ribete Fino Interior de Oro -->
    <polygon points="60,23 97,39 60,55 23,39" fill="none" stroke="url(#capGold)" stroke-width="0.8" opacity="0.7"/>

    <!-- Destello en Esquina Izquierda y Vértice Superior -->
    <polygon points="60,19 62,22 66,23 62,24 60,27 58,24 54,23 58,22" fill="#ffffff" opacity="0.85"/>

    <!-- Botón Central de Oro Facetado -->
    <circle cx="60" cy="39" r="4.2" fill="url(#capGold)" stroke="#3a2503" stroke-width="0.6"/>
    <circle cx="60" cy="39" r="2.8" fill="#fff8db"/>

    <!-- Cordón de la Borla en Seda de Oro Flotante -->
    <path d="M 60 39 Q 80 37 87 52 L 89 74" fill="none" stroke="url(#tasselSilk)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 60 39 Q 79 38 86 52 L 88 74" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.8"/>

    <!-- Pasador / Anillo de la Borla -->
    <rect x="85.5" y="73" width="7" height="3" rx="1.5" fill="url(#capGold)" stroke="#3a2503" stroke-width="0.5"/>

    <!-- Falda / Flecos de la Borla de Oro -->
    <polygon points="86,76 92,76 95,95 83,95" fill="url(#tasselSilk)" stroke="#3a2503" stroke-width="0.4"/>
    <!-- Líneas de Textura de Hilos de Seda -->
    <line x1="86.5" y1="76" x2="85" y2="94" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
    <line x1="88" y1="76" x2="88" y2="94" stroke="#7a5508" stroke-width="0.6"/>
    <line x1="90" y1="76" x2="91" y2="94" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
    <line x1="91.5" y1="76" x2="93.5" y2="94" stroke="#7a5508" stroke-width="0.6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 10 96 104" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Oro Real para Marcos y Relieves -->
    <linearGradient id="calGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="25%" stop-color="#e8c77b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#9a741e"/>
      <stop offset="100%" stop-color="#5a4208"/>
    </linearGradient>

    <linearGradient id="calGoldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- Gradiente Vino Tinto / Borgoña Imperial -->
    <linearGradient id="calWineHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800a26"/>
      <stop offset="50%" stop-color="#4d0315"/>
      <stop offset="100%" stop-color="#2a0009"/>
    </linearGradient>

    <!-- Gradiente Papel Pergamino / Marfil de Lujo -->
    <linearGradient id="calIvoryPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </linearGradient>

    <!-- Sombras Realistas -->
    <filter id="calShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1a0005" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#calShadow)">
    <!-- Corona de Laureles Decorativa Exterior en la Base -->
    <g fill="url(#calGoldRim)" opacity="0.9">
      <!-- Laurel Izquierdo -->
      <path d="M 32 96 C 24 92 18 84 16 75 C 19 78 24 81 28 82 C 22 74 20 65 21 55 C 24 60 28 64 32 66 C 28 58 29 48 32 40 C 35 46 38 51 40 54"/>
      <!-- Laurel Derecho -->
      <path d="M 88 96 C 96 92 102 84 104 75 C 101 78 96 81 92 82 C 98 74 100 65 99 55 C 96 60 92 64 88 66 C 92 58 91 48 88 40 C 85 46 82 51 80 54"/>
      <!-- Lazo Central -->
      <circle cx="60" cy="100" r="3.5" fill="url(#calGoldAccent)"/>
      <path d="M 57 101 Q 48 107 43 113 Q 50 109 58 103 Z" fill="url(#calGoldRim)"/>
      <path d="M 63 101 Q 72 107 77 113 Q 70 109 62 103 Z" fill="url(#calGoldRim)"/>
    </g>

    <!-- Respaldo / Placa de Oro Base -->
    <rect x="25" y="21" width="70" height="74" rx="8" fill="url(#calGoldRim)" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Cuerpo de Papel Marfil de Lujo -->
    <rect x="28" y="24" width="64" height="68" rx="6" fill="url(#calIvoryPage)"/>
    <rect x="30" y="26" width="60" height="64" rx="4" fill="none" stroke="#d4af37" stroke-width="0.7" opacity="0.5"/>

    <!-- Cabecera Borgoña de Gala -->
    <path d="M 28 30 C 28 26.68 30.68 24 34 24 L 86 24 C 89.32 24 92 26.68 92 30 L 92 46 L 28 46 Z" fill="url(#calWineHeader)"/>
    <line x1="28" y1="46" x2="92" y2="46" stroke="url(#calGoldAccent)" stroke-width="1.5"/>

    <!-- Anillos Dorados de Fijación con Brillo -->
    <!-- Anillo Izquierdo -->
    <g>
      <rect x="38" y="16" width="6" height="15" rx="3" fill="url(#calGoldRim)" stroke="#fff" stroke-width="0.5"/>
      <circle cx="41" cy="24" r="1.5" fill="#1a0208"/>
    </g>
    <!-- Anillo Derecho -->
    <g>
      <rect x="76" y="16" width="6" height="15" rx="3" fill="url(#calGoldRim)" stroke="#fff" stroke-width="0.5"/>
      <circle cx="79" cy="24" r="1.5" fill="#1a0208"/>
    </g>

    <!-- Texto de Mes en Cabecera "DICIEMBRE" con Brillo Oro -->
    <text x="60" y="38" font-family="'Cinzel', 'Times New Roman', serif" font-size="8.5" font-weight="bold" fill="url(#calGoldAccent)" text-anchor="middle" letter-spacing="2">DICIEMBRE</text>

    <!-- Día Principal "18" Tallado en Oro y Sombra -->
    <text x="60.5" y="77" font-family="'Cinzel', 'Times New Roman', serif" font-size="31" font-weight="900" fill="#2a0009" opacity="0.18" text-anchor="middle">18</text>
    <text x="60" y="76" font-family="'Cinzel', 'Times New Roman', serif" font-size="31" font-weight="900" fill="url(#calWineHeader)" text-anchor="middle">18</text>

    <!-- Subtexto de Día "VIERNES" y Año -->
    <text x="60" y="87" font-family="'Cinzel', 'Times New Roman', serif" font-size="6.5" font-weight="bold" fill="#800a26" text-anchor="middle" letter-spacing="1.5">2026</text>

    <!-- Pequeñas Estrellas de Gala en las Esquinas Inferiores -->
    <polygon points="36,83 37,85 39,85.5 37.5,87 38,89 36,88 34,89 34.5,87 33,85.5 35,85" fill="url(#calGoldRim)"/>
    <polygon points="84,83 85,85 87,85.5 85.5,87 86,89 84,88 82,89 82.5,87 81,85.5 83,85" fill="url(#calGoldRim)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="cashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7B1E3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#9A7222"/>
      <stop offset="100%" stop-color="#DFC8A0"/>
    </linearGradient>
    <linearGradient id="wineEnv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0D1F"/>
      <stop offset="100%" stop-color="#1E030B"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#cashGlow)"/>

  <!-- Billete / Tarjeta sobresaliendo del sobre de regalo -->
  <rect x="30" y="28" width="60" height="36" rx="4" fill="#2A0712" stroke="url(#goldCash)" stroke-width="1.8" transform="rotate(-4 60 46)"/>
  <circle cx="60" cy="44" r="9" fill="none" stroke="url(#goldCash)" stroke-width="1.5"/>
  <text x="60" y="48.5" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="11" fill="url(#goldCash)">S/</text>

  <!-- Sobre elegante de regalo -->
  <rect x="20" y="46" width="80" height="50" rx="7" fill="url(#wineEnv)" stroke="url(#goldCash)" stroke-width="2.4"/>
  <!-- Solapa inferior / cruce -->
  <path d="M22 48 L60 76 L98 48" stroke="url(#goldCash)" stroke-width="1.8" fill="none" opacity="0.85"/>
  <!-- Sello central dorado -->
  <circle cx="60" cy="74" r="9" fill="url(#goldCash)"/>
  <circle cx="60" cy="74" r="5.5" fill="#4A0D1F"/>
  <circle cx="60" cy="74" r="2.2" fill="#FFF5D6"/>

  <!-- Destellos -->
  <g transform="translate(94, 30)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#FFF5D6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#FFF5D6" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(24, 34)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>

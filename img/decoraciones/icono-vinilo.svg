<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Oro Real para Bordes y Relieves del Disco -->
    <linearGradient id="vGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="25%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#99731d"/>
      <stop offset="100%" stop-color="#523c08"/>
    </linearGradient>

    <!-- Reflejos Concéntricos de Acetato Negro/Vino Oscuro -->
    <radialGradient id="vBaseSheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d0311"/>
      <stop offset="40%" stop-color="#180106"/>
      <stop offset="70%" stop-color="#2a020c"/>
      <stop offset="100%" stop-color="#0a0003"/>
    </radialGradient>

    <!-- Destellos Angulares Típicos de Vinilo (Specular Sheen) -->
    <linearGradient id="vLightBeam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#dfc9a5" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#dfc9a5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Etiqueta Central de Terciopelo Borgoña -->
    <radialGradient id="vCenterLabel" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#800a26"/>
      <stop offset="55%" stop-color="#4d0315"/>
      <stop offset="100%" stop-color="#2a0009"/>
    </radialGradient>

    <filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#140004" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#vShadow)">
    <!-- Disco Exterior con Aro de Oro Pulido -->
    <circle cx="50" cy="50" r="48" fill="url(#vBaseSheen)" stroke="url(#vGoldRim)" stroke-width="2.2"/>
    <circle cx="50" cy="50" r="46.5" fill="none" stroke="#fff8db" stroke-width="0.6" opacity="0.6"/>

    <!-- Conos de Luz Concéntrica Típicos de Disco de Vinilo Fino -->
    <path d="M 50 50 L 16 16 A 48 48 0 0 1 84 16 Z" fill="url(#vLightBeam1)"/>
    <path d="M 50 50 L 84 84 A 48 48 0 0 1 16 84 Z" fill="url(#vLightBeam1)"/>

    <!-- Micro-Surcos de Alta Definición -->
    <circle cx="50" cy="50" r="43" fill="none" stroke="#dfc9a5" stroke-width="0.6" opacity="0.4"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.25"/>
    <circle cx="50" cy="50" r="37.5" fill="none" stroke="#dfc9a5" stroke-width="0.6" opacity="0.35"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.2"/>
    <circle cx="50" cy="50" r="31" fill="none" stroke="#dfc9a5" stroke-width="0.6" opacity="0.3"/>
    <circle cx="50" cy="50" r="27.5" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.25"/>
    <circle cx="50" cy="50" r="24" fill="none" stroke="#dfc9a5" stroke-width="0.6" opacity="0.35"/>

    <!-- Etiqueta Central de Gala -->
    <circle cx="50" cy="50" r="19" fill="url(#vGoldRim)" stroke="#3a2503" stroke-width="0.8"/>
    <circle cx="50" cy="50" r="17.5" fill="url(#vCenterLabel)"/>
    <circle cx="50" cy="50" r="15.5" fill="none" stroke="#dfc9a5" stroke-width="0.6" stroke-dasharray="1.2, 1.8" opacity="0.8"/>

    <!-- Mini Birrete Dorado Grabado en el Centro -->
    <polygon points="50,42 56,45 50,48 44,45" fill="url(#vGoldRim)"/>
    <path d="M 47 46.5 L 47 49 C 47 51 53 51 53 49 L 53 46.5 Z" fill="url(#vGoldRim)"/>
    <line x1="50" y1="45" x2="55" y2="48" stroke="#fff8db" stroke-width="0.5"/>

    <!-- Texto "CLASS 2026" en la Etiqueta -->
    <text x="50" y="55" font-family="'Cinzel', serif" font-size="4" font-weight="bold" fill="url(#vGoldRim)" text-anchor="middle" letter-spacing="1">2026</text>

    <!-- Orificio Central con Anillo de Latón / Oro -->
    <circle cx="50" cy="50" r="4.5" fill="url(#vGoldRim)"/>
    <circle cx="50" cy="50" r="3" fill="#080002"/>
    <circle cx="50" cy="50" r="2.8" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.8"/>
  </g>
</svg>

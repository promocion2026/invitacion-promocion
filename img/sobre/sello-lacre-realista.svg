<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Rich Wine Wax Gradient -->
    <radialGradient id="waxBase" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#8a1738"/>
      <stop offset="35%" stop-color="#640e25"/>
      <stop offset="70%" stop-color="#420616"/>
      <stop offset="100%" stop-color="#22020a"/>
    </radialGradient>

    <!-- Glossy Highlight for Wax Surface -->
    <linearGradient id="waxGloss" x1="20%" y1="0%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Metallic Gold Inset/Stamp Gradient -->
    <linearGradient id="waxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="30%" stop-color="#edd295"/>
      <stop offset="60%" stop-color="#c59b4c"/>
      <stop offset="90%" stop-color="#80591b"/>
      <stop offset="100%" stop-color="#55380c"/>
    </linearGradient>

    <!-- Shadow for 3D realism -->
    <filter id="wax3DShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="innerStampBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#wax3DShadow)">
    <!-- Organic Melted Wax Outer Rim (Lacre fundido con borde natural) -->
    <path d="M80,10 
             C96,9 110,13 124,24 
             C136,34 148,46 150,62 
             C152,78 147,94 139,108 
             C131,121 118,134 104,142 
             C89,150 72,151 56,146 
             C41,141 27,130 18,117 
             C9,103 8,86 10,70 
             C12,54 21,39 33,28 
             C46,16 63,11 80,10 Z" 
          fill="url(#waxBase)" stroke="#4a0818" stroke-width="2"/>

    <!-- Subtle wax rim highlights and shadows -->
    <path d="M80,14 
             C94,13 107,17 119,26 
             C130,35 140,46 142,60 
             C144,74 140,88 133,100 
             C126,112 115,123 102,130 
             C89,137 74,138 60,134 
             C47,130 35,120 27,109 
             C19,97 18,82 20,68 
             C22,54 29,41 40,31 
             C52,20 66,15 80,14 Z" 
          fill="none" stroke="url(#waxGloss)" stroke-width="3" opacity="0.7"/>

    <!-- Inner Stamp Basin (Lecho hundido del sello) -->
    <circle cx="80" cy="80" r="48" fill="#320410" stroke="#52071a" stroke-width="2"/>
    <circle cx="80" cy="80" r="46" fill="url(#waxBase)" stroke="#1a0208" stroke-width="1.5"/>

    <!-- Beaded Ornamental Gold Rim (Círculo perlado dorado) -->
    <circle cx="80" cy="80" r="42" fill="none" stroke="url(#waxGold)" stroke-width="1.8" stroke-dasharray="2.5,3.5" filter="url(#innerStampBevel)"/>
    <circle cx="80" cy="80" r="39" fill="none" stroke="url(#waxGold)" stroke-width="1" opacity="0.8"/>

    <!-- Embossed Graduation Mortarboard in Center -->
    <g filter="url(#innerStampBevel)">
      <!-- Mortarboard Top Rhombus -->
      <polygon points="80,50 108,63 80,75 52,63" fill="url(#waxGold)" stroke="#fff8dc" stroke-width="0.8"/>
      <!-- Inner facet lines -->
      <line x1="80" y1="50" x2="80" y2="75" stroke="#785317" stroke-width="0.8" opacity="0.5"/>
      <line x1="52" y1="63" x2="108" y2="63" stroke="#785317" stroke-width="0.8" opacity="0.5"/>

      <!-- Cap Skull Cap Base -->
      <path d="M60,68 L60,80 C60,89 100,89 100,80 L100,68 C94,73 87,75 80,75 C73,75 66,73 60,68 Z" fill="url(#waxGold)" stroke="#4a300a" stroke-width="0.6"/>
      
      <!-- Center button & Tassel -->
      <circle cx="80" cy="63" r="2.8" fill="#fff8dc"/>
      <path d="M80,63 Q96,64 102,77 L105,96" fill="none" stroke="url(#waxGold)" stroke-width="2" stroke-linecap="round"/>
      <polygon points="103,95 107,96 109,105 101,105" fill="url(#waxGold)"/>

      <!-- Two small stars flanking the cap -->
      <polygon points="56,76 57.5,80 61.5,80 58.5,82.5 59.5,86.5 56,84 52.5,86.5 53.5,82.5 50.5,80 54.5,80" fill="url(#waxGold)"/>
      <polygon points="104,76 105.5,80 109.5,80 106.5,82.5 107.5,86.5 104,84 100.5,86.5 101.5,82.5 98.5,80 102.5,80" fill="url(#waxGold)"/>

      <!-- Roman Numeral / Year "MMXXVI" or "2026" at the bottom -->
      <text x="80" y="103" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="9" fill="url(#waxGold)" letter-spacing="2">
        2026
      </text>
    </g>

    <!-- Gloss Curved Glint / Specular Flare -->
    <path d="M42,36 C55,24 72,20 90,22 C80,26 70,33 62,42 C54,51 48,63 46,74 C42,62 40,48 42,36 Z" fill="url(#waxGloss)" opacity="0.6"/>
  </g>
</svg>
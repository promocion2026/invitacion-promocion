<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <!-- Filtros de desenfoque y brillo -->
    <filter id="flapFoldBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="starHaloBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <!-- Gradiente de seda satinada blanca/perla acolchada -->
    <linearGradient id="flapSatinBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#ecf2f9"/>
      <stop offset="85%" stop-color="#d9e4ef"/>
      <stop offset="100%" stop-color="#c4d2e2"/>
    </linearGradient>

    <!-- Terciopelo azul noche / carbón profundo para la cinta -->
    <linearGradient id="ribbonDarkBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#182334"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>

    <!-- Plata cromada para los ribetes metálicos pulidos -->
    <linearGradient id="silverChromePiping" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Sombra 3D profunda proyectada por la solapa sobre el bolsillo -->
    <filter id="flapDeepShadow" x="-15%" y="0%" width="130%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#090d16" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#flapDeepShadow)">
    
    <!-- 1. SOLAPA TRIANGULAR DE SEDA SATINADA (Cubre totalmente la boca del sobre hasta y=142) -->
    <path d="M 2,2 
             L 398,2 
             C 338,34 268,96 200,142 
             C 132,96 62,34 2,2 Z" 
          fill="url(#flapSatinBody)" 
          stroke="url(#silverChromePiping)" 
          stroke-width="1.2"/>

    <!-- Brillo en el borde superior del pliegue -->
    <line x1="4" y1="3" x2="396" y2="3" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>

    <!-- Frunces orgánicos de tela en las esquinas superiores -->
    <g opacity="0.6">
      <!-- Esquina superior izquierda -->
      <path d="M 3,4 C 35,26 75,50 115,66" stroke="#475569" stroke-width="2.5" fill="none" filter="url(#flapFoldBlur)"/>
      <path d="M 5,3 C 37,24 77,48 117,64" stroke="#ffffff" stroke-width="3" fill="none" filter="url(#flapFoldBlur)"/>
      <path d="M 3,22 C 25,40 58,55 90,64" stroke="#475569" stroke-width="1.8" fill="none" filter="url(#flapFoldBlur)"/>

      <!-- Esquina superior derecha -->
      <path d="M 397,4 C 365,26 325,50 285,66" stroke="#475569" stroke-width="2.5" fill="none" filter="url(#flapFoldBlur)"/>
      <path d="M 395,3 C 363,24 323,48 283,64" stroke="#ffffff" stroke-width="3" fill="none" filter="url(#flapFoldBlur)"/>
      <path d="M 397,22 C 375,40 342,55 310,64" stroke="#475569" stroke-width="1.8" fill="none" filter="url(#flapFoldBlur)"/>
    </g>

    <!-- =========================================================================
         CINTAS CURVAS DE TERCIOPELO AZUL OSCURO CON RIBETES DE PLATA CROMADA
         ========================================================================= -->

    <!-- CINTA IZQUIERDA (Desde la esquina superior izquierda (2,2) al vértice (200, 142)) -->
    <!-- Base cromada exterior que forma los ribetes dobles -->
    <path d="M 0,0 
             C 60,32 130,95 200,143 
             L 204,130 
             C 134,80 65,18 10,-6 Z" 
          fill="url(#silverChromePiping)"/>

    <!-- Núcleo oscuro de terciopelo de la cinta izquierda -->
    <path d="M 2,3 
             C 62,35 132,97 198,141 
             L 202,132 
             C 136,83 68,21 11,-3 Z" 
          fill="url(#ribbonDarkBody)"/>

    <!-- Ribetes cromados con reflejos blancos intensos -->
    <path d="M 1,1 C 61,33 131,96 199,142" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 11,-4 C 67,19 135,81 202,131" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>


    <!-- CINTA DERECHA (Desde la esquina superior derecha (398,2) al vértice (200, 142)) -->
    <!-- Base cromada exterior que forma los ribetes dobles -->
    <path d="M 400,0 
             C 340,32 270,95 200,143 
             L 196,130 
             C 266,80 335,18 390,-6 Z" 
          fill="url(#silverChromePiping)"/>

    <!-- Núcleo oscuro de terciopelo de la cinta derecha -->
    <path d="M 398,3 
             C 338,35 268,97 202,141 
             L 198,132 
             C 264,83 332,21 389,-3 Z" 
          fill="url(#ribbonDarkBody)"/>

    <!-- Ribetes cromados con reflejos blancos intensos -->
    <path d="M 399,1 C 339,33 269,96 201,142" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 389,-4 C 333,19 265,81 198,131" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>


    <!-- =========================================================================
         DESTELLO EN FORMA DE ESTRELLA (STAR SPARKLE / GLINT) EN LA CINTA DERECHA
         ========================================================================= -->
    <g transform="translate(305, 68)">
      <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.4" filter="url(#starHaloBlur)"/>
      <circle cx="0" cy="0" r="8" fill="#93c5fd" opacity="0.5" filter="url(#starHaloBlur)"/>
      <polygon points="0,-24 4.5,-5.5 24,0 4.5,5.5 0,24 -4.5,5.5 -24,0 -4.5,-5.5" fill="#ffffff" filter="drop-shadow(0 0 6px rgba(255,255,255,0.95))"/>
      <polygon points="0,-13 3,-3 13,0 3,3 0,13 -3,3 -13,0 -3,-3" transform="rotate(45)" fill="#e2e8f0" opacity="0.85"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2" fill="#dbeafe"/>
    </g>

  </g>
</svg>
